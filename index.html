<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FITNESS PERFORMANCE PRO · Dark Athletic Clinical</title>
<style>

button,input,select{font:inherit}button{cursor:pointer;border:1px solid #31513a;background:#16231a;color:#dfffe3;border-radius:10px;padding:9px 12px}button:hover{border-color:var(--green);color:var(--green)}input,select{background:#0b100d;color:#eaffed;border:1px solid #2a3b2e;border-radius:8px;padding:9px;width:100%}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.section{display:none}.section.active{display:block}.section h2{margin:0 0 14px;font-size:23px}.sectionHead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:4px 0 15px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bar{height:9px;background:#263329;border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--lime));border-radius:99px}

@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid #1c2b20;padding:10px}.brand{margin:5px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.hero{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}main{padding:14px}.grid2{grid-template-columns:1fr}.formrow{grid-template-columns:repeat(2,1fr)}}
</style></head><body>

<!-- SUPABASE AUTH INTEGRATION -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);

  const urlInput = $('sb-url');
  const keyInput = $('sb-key');
  const statusEl = $('sb-status');
  const messageEl = $('sb-message');
  const configEl = $('sb-config');
  const authEl = $('sb-auth');

  if (!urlInput || !keyInput || !statusEl || !messageEl ||
      !configEl || !authEl || !$('sb-connect')) {
    console.error('Supabase: faltan elementos HTML.');
    return;
  }

  let client = null;
  let authSubscription = null;
  let busy = false;

  const saved = (() => {
    try {
      return JSON.parse(localStorage.getItem('fp_supabase_config') || '{}');
    } catch {
      return {};
    }
  })();

  if (saved.url) urlInput.value = saved.url;
  if (saved.key) keyInput.value = saved.key;

  function message(text, isError = false) {
    messageEl.textContent = text;
    messageEl.style.color = isError ? '#ff8b8b' : '#a8bac8';
  }

  function status(text, connected = false) {
    statusEl.textContent = text;
    statusEl.style.background = connected ? '#183527' : '#26313b';
    statusEl.style.color = connected ? '#b8ff3b' : '#c5d2dc';
  }

  function setAuthUI(session) {
    const signedIn = !!session?.user;

    configEl.style.display = client ? 'none' : 'grid';
    authEl.style.display = client ? 'grid' : 'none';

    $('sb-user').textContent = signedIn
      ? 'Sesión activa: ' + session.user.email
      : 'Proyecto conectado. Inicia sesión o crea tu cuenta.';

    $('sb-login').style.display = signedIn ? 'none' : 'block';
    $('sb-signup').style.display = signedIn ? 'none' : 'block';
    $('sb-reset').style.display = signedIn ? 'none' : 'block';
    $('sb-logout').style.display = signedIn ? 'block' : 'none';

    status(signedIn ? 'Sesión activa' : 'Proyecto conectado', true);
  }

  async function connect() {
    if (busy) return;

    const url = urlInput.value.trim().replace(/\/$/, '');
    const key = keyInput.value.trim();

    if (!/^https:\/\/[a-zA-Z0-9-]+\.supabase\.co$/.test(url)) {
      message('URL inválida. Revisa la dirección del proyecto.', true);
      return;
    }

    if (!key.startsWith('sb_publishable_')) {
      message('La clave debe comenzar con sb_publishable_.', true);
      return;
    }

    if (!window.supabase?.createClient) {
      message('No se cargó Supabase JS. Recarga la página e inténtalo nuevamente.', true);
      return;
    }

    busy = true;
    $('sb-connect').disabled = true;
    message('Conectando con Supabase...');

    try {
      if (authSubscription) {
        authSubscription.unsubscribe();
        authSubscription = null;
      }

      const newClient = window.supabase.createClient(url, key);

      const { data, error } = await newClient.auth.getSession();
      if (error) throw error;

      client = newClient;
      window.fpSupabaseClient = client;

      localStorage.setItem(
        'fp_supabase_config',
        JSON.stringify({ url, key })
      );

      setAuthUI(data.session);

      authSubscription = client.auth.onAuthStateChange(
        (_event, session) => setAuthUI(session)
      ).data.subscription;

      message('Proyecto conectado correctamente. Puedes iniciar sesión.');

    } catch (error) {
      client = null;
      window.fpSupabaseClient = null;
      configEl.style.display = 'grid';
      authEl.style.display = 'none';
      status('Error de conexión');
      message('Error al conectar: ' + (error.message || error), true);
      console.error('Supabase connect:', error);

    } finally {
      busy = false;
      $('sb-connect').disabled = false;
    }
  }

  async function authAction(action, successText) {
    if (busy) return;

    if (!client) {
      message('Primero conecta el proyecto Supabase.', true);
      return;
    }

    const email = $('sb-email').value.trim();
    const password = $('sb-password').value;

    if (!email) {
      message('Ingresa tu correo.', true);
      return;
    }

    if (!password) {
      message('Ingresa tu contraseña.', true);
      return;
    }

    busy = true;
    message('Procesando solicitud...');

    $('sb-login').disabled = true;
    $('sb-signup').disabled = true;

    try {
      const result = await action(email, password);
      if (result.error) throw result.error;

      if (result.data?.session) {
        message('Sesión iniciada correctamente.');
      } else if (result.data?.user) {
        message('Cuenta creada. Revisa tu correo si se solicita confirmación.');
      } else {
        message(successText);
      }

    } catch (error) {
      const msg = error.message || 'Error desconocido';

      if (msg.toLowerCase().includes('invalid login')) {
        message('Correo o contraseña incorrectos.', true);
      } else if (msg.toLowerCase().includes('already registered')) {
        message('Este correo ya tiene una cuenta. Usa Iniciar sesión.', true);
      } else if (msg.toLowerCase().includes('password')) {
        message('Revisa la contraseña. Debe tener al menos 6 caracteres.', true);
      } else if (msg.toLowerCase().includes('fetch')) {
        message('Error de red. Revisa internet y vuelve a intentarlo.', true);
      } else {
        message('Error Supabase: ' + msg, true);
      }

      console.error('Supabase auth:', error);

    } finally {
      busy = false;
      $('sb-login').disabled = false;
      $('sb-signup').disabled = false;
    }
  }

  // Conexión del botón
  $('sb-connect').onclick = connect;

  // Inicio de sesión
  $('sb-login').onclick = () => authAction(
    (email, password) =>
      client.auth.signInWithPassword({ email, password }),
    'Inicio de sesión correcto.'
  );

  // Crear cuenta
  $('sb-signup').onclick = () => authAction(
    (email, password) => {
      if (password.length < 6) {
        return Promise.resolve({
          error: new Error('La contraseña debe tener al menos 6 caracteres.')
        });
      }

      return client.auth.signUp({ email, password });
    },
    'Registro enviado.'
  );

  // Recuperar contraseña
  $('sb-reset').onclick = async () => {
    if (!client) {
      message('Primero conecta el proyecto Supabase.', true);
      return;
    }

    const email = $('sb-email').value.trim();

    if (!email) {
      message('Escribe tu correo primero.', true);
      return;
    }

    try {
      const { error } = await client.auth.resetPasswordForEmail(email, {
        redirectTo: location.href.split('#')[0]
      });

      if (error) throw error;
      message('Solicitud enviada. Revisa tu correo.');

    } catch (error) {
      message('Error al recuperar contraseña: ' + error.message, true);
    }
  };

  // Cerrar sesión
  $('sb-logout').onclick = async () => {
    if (!client) return;

    try {
      const { error } = await client.auth.signOut();
      if (error) throw error;
      message('Sesión cerrada correctamente.');

    } catch (error) {
      message('Error al cerrar sesión: ' + error.message, true);
    }
  };

  // Recuperar configuración guardada
  if (saved.url && saved.key) {
    status('Configuración guardada');
    message('Configuración recuperada. Pulsa Conectar proyecto.');
  }

  console.log('Fitness Performance Pro: Supabase Auth inicializado.');

})();

// Navegación existente
document.querySelectorAll('#nav button[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (typeof tab === 'function') tab(btn.dataset.tab);
  });
});
</script>
